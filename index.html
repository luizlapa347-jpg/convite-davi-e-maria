<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chá Revelação — Davi e Maria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fdf7f4;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #333;
    }

    .convite {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 15px;
    }

    .pdf {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 12px;
      background: white;
    }

    .botao {
      display: inline-block;
      margin: 18px auto;
      padding: 16px 28px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .texto {
      font-size: 16px;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div class="convite">

    <p class="texto">
      💙🩷 Venha viver esse momento especial com a gente! 🩷💙
    </p>

    <iframe
      class="pdf"
      src="Convite_Cha_Revelacao_Davi_Maria.pdf">
    </iframe>

    <br>

    <div class="confirmacao">
  <h2>💚 Confirmar presença</h2>

  <label>Seu nome</label>
  <input type="text" id="nome" placeholder="Digite seu nome">

  <label>Quantidade de pessoas</label>
  <input type="number" id="quantidade" min="1" value="1">

  <label>Observação</label>
  <textarea id="observacao" placeholder="Digite uma observação (opcional)"></textarea>

  <button type="button" onclick="enviarConfirmacao()">
    ✅ ENVIAR CONFIRMAÇÃO
  </button>
</div>

<script>
function enviarConfirmacao() {
  const nome = document.getElementById("nome").value.trim();
  const quantidade = document.getElementById("quantidade").value;
  const observacao = document.getElementById("observacao").value.trim();

  if (!nome) {
    alert("Por favor, informe seu nome.");
    return;
  }

  const mensagem =
`💚 CONFIRMAÇÃO DE PRESENÇA — CHÁ REVELAÇÃO DAVI E MARIA

👤 Nome: ${nome}
👥 Quantidade de pessoas: ${quantidade}
📝 Observação: ${observacao || "Nenhuma"}

✅ Presença confirmada!`;

  const numero = "5521983049551";
  const url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);

  window.open(url, "_blank");
}
</script>
      

    <p class="texto">
      Clique no botão acima para confirmar sua presença pelo WhatsApp.
    </p>

  </div>

</body>
</html>
